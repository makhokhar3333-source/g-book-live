    const vals=new Float32Array(1024);
    let sum=0;
    for(let i=0,j=0;i<d.length;i+=4,j++){
      const y=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;
      vals[j]=y;sum+=y;
    }
    vals.sort();
    return{mean:sum/1024,p90:vals[920]};
  }catch(e){return{mean:0.42,p90:0.75}}
}

/* ============================================================================
   GPU Studio Engine (WebGL Fragment Shader + Fast Canvas2D Fallback)
   Combines all iPhone 17/18 Pro Max features into ONE 0%-100% control:
   - Auto f/1.48 low-light shadow lift & f/4.0 bright sky highlight protection
   - Natural HDR tone mapping & rich contrast
   - Warm studio key-light skin glow with texture-safe edge sharpening
   - Subtle optical center depth pop & 48MP-style detail clarity
   ============================================================================ */
const VS_SRC=`
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv=vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5);
  gl_Position=vec4(aPos,0.0,1.0);
}`;

const FS_SRC=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uAmt;
uniform float uMean;
uniform float uP90;
varying vec2 vUv;

float luma(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}

void main(){
  vec3 orig=texture2D(uTex,vUv).rgb;
  if(uAmt<=0.001){gl_FragColor=vec4(orig,1.0);return;}

  /* Fine 1.25px tap for 48MP crisp sharpening + wider 3.5px tap for 3D local micro-contrast */
  vec2 s1=uTexel*1.25;
  vec3 n1=texture2D(uTex,clamp(vUv+vec2(0.0,-s1.y),0.0,1.0)).rgb;
  vec3 s_1=texture2D(uTex,clamp(vUv+vec2(0.0, s1.y),0.0,1.0)).rgb;
  vec3 e1=texture2D(uTex,clamp(vUv+vec2( s1.x,0.0),0.0,1.0)).rgb;
  vec3 w1=texture2D(uTex,clamp(vUv+vec2(-s1.x,0.0),0.0,1.0)).rgb;
  vec3 avgFine=0.25*(n1+s_1+e1+w1);

  vec2 s2=uTexel*3.5;
  vec3 n2=texture2D(uTex,clamp(vUv+vec2(0.0,-s2.y),0.0,1.0)).rgb;
  vec3 s_2=texture2D(uTex,clamp(vUv+vec2(0.0, s2.y),0.0,1.0)).rgb;
  vec3 e2=texture2D(uTex,clamp(vUv+vec2( s2.x,0.0),0.0,1.0)).rgb;
  vec3 w2=texture2D(uTex,clamp(vUv+vec2(-s2.x,0.0),0.0,1.0)).rgb;
  vec3 avgWide=0.25*(n2+s_2+e2+w2);

  float l=luma(orig);
  float lFine=luma(avgFine);
  float lWide=luma(avgWide);
  float fineDetail=l-lFine;
  float localClarity=l-lWide;

  /* 1. Strict Scene-Adaptive Exposure:
        - Bright/Outdoor (uMean > 0.45): ZERO boost; activate f/4.0 Highlight Recovery
        - Dark/Night (uMean < 0.35): f/1.48 clean shadow lift without gray haze */
  float nightBoost=clamp((0.35-uMean)/0.24,0.0,1.0);
  float brightScene=clamp((uMean-0.45)/0.28,0.0,1.0);
  float hiScene=clamp((uP90-0.68)/0.25,0.0,1.0);
  float outdoorProtect=max(brightScene,hiScene*0.85);

  vec3 c=orig;

  /* Night/Low-light shadow recovery ONLY when uMean < 0.35 */
  if(nightBoost>0.001){
    float sw=pow(clamp(1.0-l,0.0,1.0),2.15)*smoothstep(0.015,0.12,l);
    c*=1.0+0.62*nightBoost*uAmt*sw;
  }

  /* Bright/Outdoor f/4.0 Highlight Recovery & Midtone Anchoring (never adds white haze) */
  float hiMask=smoothstep(0.50,0.98,l);
  float hiPull=(0.12+0.22*outdoorProtect)*uAmt*hiMask;
  c*=(1.0-hiPull);

  /* Filmic highlight shoulder roll-off so white buildings & skies regain crisp detail */
  float l1=luma(c);
  if(l1>0.64){
    float over=(l1-0.64)/0.36;
    float compressed=0.64+0.36*(1.0-exp(-1.55*over))/0.7877;
    c*=compressed/max(l1,0.0001);
  }

  /* Slight midtone grounding in bright scenes so subjects never look pale */
  float midToneMask=smoothstep(0.15,0.45,l)*(1.0-smoothstep(0.55,0.90,l));
  c*=1.0-0.06*brightScene*uAmt*midToneMask;

  /* 2. Deep Black-Point Anchor & Rich Contrast (hair, sunglasses, dark clothes pop in 3D) */
  float blackDepth=0.028*(1.0-0.75*nightBoost)*uAmt;
  c=max(c-vec3(blackDepth)*smoothstep(0.35,0.0,l),0.0);
  vec3 sCurve=c*c*(3.0-2.0*c);
  c=mix(c,sCurve,(0.34+0.14*outdoorProtect)*uAmt);

  /* 3. Local Micro-Contrast (3D separation on architecture, foliage & faces) */
  c=clamp(c+localClarity*(0.32*uAmt)*(1.0-0.3*hiMask),0.0,1.0);

  /* 4. Natural Golden Skin Tone (Multiplicative warmth - rich, never pale or milky) */
  float maxC=max(c.r,max(c.g,c.b));
  float minC=min(c.r,min(c.g,c.b));
  float satC=maxC-minC;
  float lCur=luma(c);
  float isSkin=smoothstep(0.025,0.15,c.r-c.b)
              *smoothstep(0.005,0.08,c.r-c.g)
              *smoothstep(0.10,0.30,lCur)
              *(1.0-smoothstep(0.84,0.97,lCur))
              *smoothstep(0.03,0.20,satC);

  vec3 skinMult=vec3(1.0+0.075*uAmt,1.0+0.022*uAmt,1.0-0.068*uAmt);
  float skinBrightCheck=1.0-0.065*outdoorProtect*uAmt*smoothstep(0.56,0.88,lCur);
  c=mix(c,clamp(c*skinMult*skinBrightCheck,0.0,1.0),isSkin);

  /* Subtle warm golden-hour balance without raising brightness */
  vec3 wbMult=vec3(1.0+0.025*uAmt,1.0+0.006*uAmt,1.0-0.028*uAmt);
  c=clamp(c*mix(vec3(1.0),wbMult,1.0-0.55*hiMask),0.0,1.0);

  /* 5. Clean Smart Vibrance (vivid greens & sky blues without neon clipping) */
  float curSat=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));
  float vib=(0.28+0.10*outdoorProtect)*(1.0-0.42*curSat)*(1.0-0.30*isSkin)*uAmt;
  float lSat=luma(c);
  c=clamp(mix(vec3(lSat),c,1.0+vib),0.0,1.0);

  /* 6. Crisp 48MP-Style Unsharp Clarity (razor-sharp eyes, hair & buildings) */
  float edgeGate=smoothstep(0.006,0.026,abs(fineDetail));
  float sharpStr=mix(1.18,0.68,isSkin*(1.0-smoothstep(0.025,0.07,abs(fineDetail))));
  float sharpDelta=clamp(fineDetail*sharpStr*edgeGate*uAmt,-0.16,0.16);
  c=clamp(c+sharpDelta*(c/max(luma(c),0.08)*0.35+0.65),0.0,1.0);

  /* 7. Subtle optical vignette for 3D subject focus */
  float dist=length((vUv-0.5)*vec2(1.0,0.86));
  float vig=1.0-0.14*uAmt*smoothstep(0.38,0.98,dist);
  c=clamp(c*vig,0.0,1.0);

  gl_FragColor=vec4(c,1.0);
}`;

function createGLRenderer(canvas){
  const opts={alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:true,powerPreference:'high-performance'};
  const gl=canvas.getContext('webgl2',opts)||canvas.getContext('webgl',opts)||canvas.getContext('experimental-webgl',opts);
  if(!gl)return null;
  function compile(type,src){
    const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))return null;
    return sh;
  }
  const vs=compile(gl.VERTEX_SHADER,VS_SRC),fs=compile(gl.FRAGMENT_SHADER,FS_SRC);
  if(!vs||!fs)return null;
  const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))return null;
  gl.useProgram(prog);

  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  const loc={
    uTex:gl.getUniformLocation(prog,'uTex'),
    uTexel:gl.getUniformLocation(prog,'uTexel'),
    uAmt:gl.getUniformLocation(prog,'uAmt'),
    uMean:gl.getUniformLocation(prog,'uMean'),
    uP90:gl.getUniformLocation(prog,'uP90')
  };
  gl.uniform1i(loc.uTex,0);
  const maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE)||2048;

  return{
    maxTex,
    dispose(){
      try{const ext=gl.getExtension('WEBGL_lose_context');if(ext)ext.loseContext()}catch(e){}
    },
    render(source,w,h,amt,mean,p90){
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      gl.viewport(0,0,w,h);
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);
      gl.uniform2f(loc.uTexel,1/w,1/h);
      gl.uniform1f(loc.uAmt,amt);
      gl.uniform1f(loc.uMean,mean);
      gl.uniform1f(loc.uP90,p90);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
  };
}

let gpuPreview=createGLRenderer(cv);
let cpuPreviewCtx=gpuPreview?null:cv.getContext('2d',{willReadFrequently:true});

function cpuEnhance(ctx,w,h,amt,mean,p90){
  if(amt<=0.001)return;
  const id=ctx.getImageData(0,0,w,h),d=id.data;
  const nightBoost=clamp((0.35-mean)/0.24,0,1);
  const brightScene=clamp((mean-0.45)/0.28,0,1);
  const hiScene=clamp((p90-0.68)/0.25,0,1);
  const outdoorProtect=Math.max(brightScene,hiScene*0.85);
  const blackDepth=0.028*(1-0.75*nightBoost)*amt;
  const curveStr=(0.34+0.14*outdoorProtect)*amt;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
    const l=0.2126*r+0.7152*g+0.0722*b;
    if(nightBoost>0.001&&l>0.015){
      const sw=Math.pow(1-l,2.15)*clamp((l-0.015)/0.105,0,1);
      const k=1+0.62*nightBoost*amt*sw;
      r*=k;g*=k;b*=k;
    }
    const hiMask=clamp((l-0.50)/0.48,0,1);
    const hiPull=1-(0.12+0.22*outdoorProtect)*amt*hiMask;
    r*=hiPull;g*=hiPull;b*=hiPull;
    const l1=0.2126*r+0.7152*g+0.0722*b;
    if(l1>0.64){
      const over=(l1-0.64)/0.36;
      const comp=(0.64+0.36*(1-Math.exp(-1.55*over))/0.7877)/Math.max(l1,0.0001);
      r*=comp;g*=comp;b*=comp;
    }
    const bd=blackDepth*clamp((0.35-l)/0.35,0,1);
    r=clamp(r-bd,0,1);g=clamp(g-bd,0,1);b=clamp(b-bd,0,1);
    r+=(r*r*(3-2*r)-r)*curveStr;
    g+=(g*g*(3-2*g)-g)*curveStr;
    b+=(b*b*(3-2*b)-b)*curveStr;
    const lCur=0.2126*r+0.7152*g+0.0722*b;
    const isSkin=(r-b>0.04&&r-g>0.01&&lCur>0.12&&lCur<0.90)?1:0;
    if(isSkin){
      const sb=1-0.065*outdoorProtect*amt*clamp((lCur-0.56)/0.32,0,1);
      r=clamp(r*(1+0.075*amt)*sb,0,1);
      g=clamp(g*(1+0.022*amt)*sb,0,1);
      b=clamp(b*(1-0.068*amt)*sb,0,1);
    }
    const lSat=0.2126*r+0.7152*g+0.0722*b;
    const vib=1+(0.26+0.08*outdoorProtect)*(isSkin?0.7:1)*amt;
    d[i]=clamp(lSat+(r-lSat)*vib,0,1)*255;
    d[i+1]=clamp(lSat+(g-lSat)*vib,0,1)*255;
    d[i+2]=clamp(lSat+(b-lSat)*vib,0,1)*255;
  }
  ctx.putImageData(id,0,0);
  if(w>2&&h>2){
    const sd=new Uint8ClampedArray(d),k=0.45*amt;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        const p=(y*w+x)*4;
        for(let c=0;c<3;c++){
          const avg=(sd[p-4+c]+sd[p+4+c]+sd[p-w*4+c]+sd[p+w*4+c])*0.25;
          const diff=sd[p+c]-avg;
          if(Math.abs(diff)>3)d[p+c]=clamp(sd[p+c]+clamp(diff*k,-32,32),0,255);
        }
      }
    }
    ctx.putImageData(id,0,0);
  }
}

function drawFrame(source,w,h,amt,mean,p90){
  if(gpuPreview){
    gpuPreview.render(source,w,h,amt,mean,p90);
  }else if(cpuPreviewCtx){
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    cpuPreviewCtx.imageSmoothingEnabled=true;
    cpuPreviewCtx.imageSmoothingQuality='high';
    cpuPreviewCtx.drawImage(source,0,0,w,h);
    cpuEnhance(cpuPreviewCtx,w,h,amt,mean,p90);
  }
}

function fit(w,h,max){const s=Math.min(1,max/Math.max(w,h));return[Math.max(2,Math.round(w*s)&~1),Math.max(2,Math.round(h*s)&~1)]}

function renderPhoto(){
  if(st.kind!=='photo'||!st.src)return;
  const{w,h}=st.dim;
  drawFrame(st.src,w,h,st.hold?0:st.amt/100,st.mean,st.p90);
}

function drawVideoFrame(w,h){
  if(st.kind!=='video'||vid.readyState<2)return;
  const tw=w||st.dim.w,th=h||st.dim.h;
  if(++st.fc%24===1){
    const s=analyzeScene(vid);
    st.mean=st.mean*0.6+s.mean*0.4;
    st.p90=st.p90*0.6+s.p90*0.4;
  }
  drawFrame(vid,tw,th,st.hold?0:st.amt/100,st.mean,st.p90);
  if(st.vtrack&&st.vtrack.requestFrame)st.vtrack.requestFrame();
}

function loop(){
  const id=++st.lid;
  const step=()=>{
    if(id!==st.lid||st.kind!=='video'||st.exporting)return;
    drawVideoFrame();
    if(vid.requestVideoFrameCallback)vid.requestVideoFrameCallback(step);
    else st.raf=requestAnimationFrame(step);
  };
  step();
}

function show(kind){
  st.kind=kind;st.lid++;cancelAnimationFrame(st.raf);
  cv.style.display='block';$('empty').style.display='none';$('exp').disabled=false;
  $('pickWrap').classList.add('compact');
  $('play').style.display=kind==='video'?'flex':'none';
  if(kind==='video'){
    vid.loop=true;vid.muted=false;vid.volume=1;vid.playbackRate=1;
    vid.play().catch(()=>{
      vid.muted=true;vid.play().catch(()=>{});
      const un=()=>{vid.muted=false;vid.volume=1;if(st.ac&&st.ac.state!=='running')st.ac.resume();removeEventListener('pointerdown',un)};
      addEventListener('pointerdown',un);
    });
    $('play').textContent='❚❚';
    loop();
  }else{
    vid.pause();
    renderPhoto();
  }
}

$('bg').onclick=()=>{const fg=$('fg');fg.value='';fg.click()};

function readDataUrl(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>typeof r.result==='string'?res(r.result):rej(new Error('Read failed'));
    r.onerror=()=>rej(r.error||new Error('Read failed'));
    r.readAsDataURL(f);
  });
}

async function detectKind(f){
  const t=(f.type||'').toLowerCase().trim(),n=f.name||'';
  if(t.startsWith('image/'))return'photo';
  if(t.startsWith('video/'))return'video';
  if(/\.(jpe?g|png|webp|gif|bmp|heic|heif|avif|tiff?|ico|dng)$/i.test(n))return'photo';
  if(/\.(mp4|mov|m4v|webm|3gp|3g2|mkv|avi|ts|mts|m2ts|flv|wmv)$/i.test(n))return'video';
  try{
    const b=new Uint8Array(await f.slice(0,32).arrayBuffer());
    if(b.length>=3&&b[0]===0xff&&b[1]===0xd8&&b[2]===0xff)return'photo';
    if(b.length>=4&&b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47)return'photo';
    if(b.length>=4&&b[0]===0x47&&b[1]===0x49&&b[2]===0x46&&b[3]===0x38)return'photo';
    if(b.length>=2&&b[0]===0x42&&b[1]===0x4d)return'photo';
    if(b.length>=4&&b[0]===0x1a&&b[1]===0x45&&b[2]===0xdf&&b[3]===0xa3)return'video';
    if(b.length>=12&&b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46){
      const s=String.fromCharCode(b[8],b[9],b[10],b[11]);
      if(s==='WEBP')return'photo';
      if(s==='AVI ')return'video';
    }
    if(b.length>=12&&b[4]===0x66&&b[5]===0x74&&b[6]===0x79&&b[7]===0x70){
      const br=String.fromCharCode(b[8],b[9],b[10],b[11]).toLowerCase();
      if(/^(heic|heix|hevc|hevx|mif1|msf1|avif|avis)$/.test(br))return'photo';
      return'video';
    }
  }catch(e){}
  return'unknown';
}

function loadImgSrc(src){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=async()=>{
      try{if(img.decode)await img.decode().catch(()=>{})}catch(e){}
      if(img.naturalWidth>0&&img.naturalHeight>0)res(img);
      else rej(new Error('Empty image'));
    };
    img.onerror=()=>rej(new Error('Image load failed'));
    img.src=src;
  });
}

function toCanvas(src,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  x.drawImage(src,0,0,w,h);
  return c;
}

function resetMedia(){
  st.lid++;cancelAnimationFrame(st.raf);
  vid.onloadeddata=null;vid.oncanplay=null;vid.onerror=null;
  vid.pause();vid.removeAttribute('src');
  try{vid.load()}catch(e){}
  if(st.url){try{URL.revokeObjectURL(st.url)}catch(e){}st.url=null}
  st.src=null;st.full=null;st.file=null;st.hold=false;
  $('cmp').classList.remove('on');$('badge').classList.remove('on');
}

$('fg').onchange=async e=>{
  const inp=e.target,f=inp.files&&inp.files[0];inp.value='';
  if(!f)return;
  const mySeq=++st.seq;
  const kind=await detectKind(f);
  if(mySeq!==st.seq)return;
  if(kind==='video')loadVideo(f,mySeq);
  else if(kind==='photo')await loadPhoto(f,mySeq);
  else{
    try{await loadPhoto(f,mySeq)}
    catch(err){toast('Please pick a photo or video file.',3200)}
  }
};

async function loadPhoto(f,mySeq){
  const maxTex=(gpuPreview&&gpuPreview.maxTex)||2048;
  const safeMax=Math.max(1024,Math.min(3264,maxTex));
  let decoded=null,tmpUrl=null;
  try{
    try{tmpUrl=URL.createObjectURL(f);decoded=await loadImgSrc(tmpUrl)}catch(e){decoded=null}
    if(!decoded){
      try{decoded=await loadImgSrc(await readDataUrl(f))}catch(e){decoded=null}
    }
    if(!decoded&&window.createImageBitmap){
      try{decoded=await createImageBitmap(f,{imageOrientation:'from-image'})}
      catch(e){try{decoded=await createImageBitmap(f)}catch(e2){decoded=null}}
    }
    if(!decoded)throw new Error('decode failed');
    if(mySeq!==st.seq)return;
    const sw=decoded.naturalWidth||decoded.width,sh=decoded.naturalHeight||decoded.height;
    if(!sw||!sh)throw new Error('empty');
    const[ew,eh]=fit(sw,sh,safeMax);
    const[pw,ph]=fit(ew,eh,Math.min(MAXP,safeMax));
    const exportCv=toCanvas(decoded,ew,eh);
    const previewCv=(pw===ew&&ph===eh)?exportCv:toCanvas(exportCv,pw,ph);
    resetMedia();
    st.src=previewCv;st.full=exportCv;st.dim={w:pw,h:ph};
    const s=analyzeScene(previewCv);st.mean=s.mean;st.p90=s.p90;
    show('photo');
    requestAnimationFrame(()=>{if(mySeq===st.seq)renderPhoto()});
  }catch(e){
    if(mySeq===st.seq)toast('Could not open that photo.');
  }finally{
    if(tmpUrl)try{URL.revokeObjectURL(tmpUrl)}catch(e){}
    if(decoded&&decoded.close)try{decoded.close()}catch(e){}
  }
}

function loadVideo(f,mySeq){
  resetMedia();
  st.file=f;
  const attach=(srcUrl,canFallback)=>{
    if(mySeq!==st.seq)return;
    let handled=false;
    const onReady=()=>{
      if(handled||mySeq!==st.seq)return;
      if(!vid.videoWidth||!vid.videoHeight)return;
      handled=true;
      vid.onloadeddata=null;vid.oncanplay=null;vid.onerror=null;

function adsPreload(k){
  const S=Ads[k];
  if(k==='I'&&!ADMOB_INTERSTITIAL_ID)return Promise.resolve('disabled');
  if(S.ready)return Promise.resolve('ready');
  if(S.p)return S.p;
  if(!navigator.onLine)return Promise.resolve('offline');
  S.p=(async()=>{
    if(!(await adsInit()))return'no_plugin';
    const A=getAdMobPlugin();
    try{
      if(k==='R'){
        if(typeof A.prepareRewardVideoAd==='function')await A.prepareRewardVideoAd({adId:ADMOB_REWARDED_ID,isTesting:USE_TEST_ADS});
        else if(typeof A.prepareRewardedVideoAd==='function')await A.prepareRewardedVideoAd({adId:ADMOB_REWARDED_ID,isTesting:USE_TEST_ADS});
      }else{
        if(typeof A.prepareInterstitial==='function')await A.prepareInterstitial({adId:ADMOB_INTERSTITIAL_ID,isTesting:USE_TEST_ADS});
      }
      S.ready=true;S.fails=0;

    }catch(e){
      S.ready=false;S.fails++;
      clearTimeout(S.t);
      S.t=setTimeout(()=>{if(navigator.onLine)adsPreload(k)},backoff(S.fails));
      return'error';
    }finally{S.p=null}
  })();
  return S.p;
}

async function showOneAd(kind){
  const A=getAdMobPlugin();
  let got=false,failed=false,settled=false,sawHidden=false;
  let resolveAd;
  const doneP=new Promise(r=>resolveAd=r);
  const cleanup=()=>{document.removeEventListener('visibilitychange',onVis)};
  const finish=()=>{if(settled)return;settled=true;cleanup();resolveAd({got,failed})};
  const onVis=()=>{
    if(document.hidden){sawHidden=true;return}
    if(sawHidden)setTimeout(()=>{if(!settled)finish()},1200);
  };
  document.addEventListener('visibilitychange',onVis);

  Ads.onReward=()=>{got=true};
  Ads.onEnd=()=>setTimeout(finish,150);
  Ads.onFail=()=>{failed=true;setTimeout(finish,150)};
  Ads[kind].ready=false;

  try{
    if(kind==='R'){
      const r=typeof A.showRewardVideoAd==='function'?await A.showRewardVideoAd():await A.showRewardedVideoAd();
      if(r&&(r.type!==undefined||r.amount!==undefined)){
        got=true;
        setTimeout(finish,450);
      }else if(sawHidden&&!document.hidden){
        setTimeout(finish,800);
      }
    }else{
      await A.showInterstitial();
      got=true;
      setTimeout(finish,450);
    }
  }catch(e){
    failed=true;
    finish();
  }
  return doneP;
}

async function runAd(){
  st.wasPlaying=st.kind==='video'&&!vid.paused;
  if(st.wasPlaying)vid.pause();
  $('ring').textContent='…';$('bar').style.width='0';$('bar').classList.add('ind');$('pct').textContent='';

    $('adfoot').textContent='Loading ad…';
    if(!(await adsInit())){

    let kind=null;
    const t0=Date.now();
    let nextTry=0;
    for(;;){
      if(Ads.R.ready){kind='R';break}

      if(Date.now()>=nextTry){adsPreloadAll();nextTry=Date.now()+1800}
      await wait(150);

    if(kind){
      let res=await showOneAd(kind);
      /* If Rewarded failed to show, instantly try Interstitial backup if available */
      if(res.failed&&kind==='R'&&Ads.I.ready){
        res=await showOneAd('I');

        closeAd();

async function save(name,blob){
  try{
    if(!blob||!blob.size)throw new Error('Empty export file');
    const F=plug('Filesystem');
    if(!F){
      /* Web browser fallback download */
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
      toast('Saved: '+name,3200);closeAd();return;
    }
    try{await F.requestPermissions()}catch(e){}
    const tries=[['EXTERNAL_STORAGE','Pictures/G-Book Camera/'],['DOCUMENTS','G-Book Camera/'],['DATA','']],CH=1536*1024;
    for(const[directory,pre]of tries){
      try{
        for(let o=0,i=0;o<blob.size||i===0;o+=CH,i++){
          const data=await b64(blob.slice(o,o+CH));
          if(i===0)await F.writeFile({path:pre+name,data,directory,recursive:true});
          else await F.appendFile({path:pre+name,data,directory});
        }
        if(directory==='EXTERNAL_STORAGE'){
          try{const M=plug('MediaScan');if(M)await M.scan({path:pre+name})}catch(e){}
        }
        toast('Saved to Gallery: '+name,3500);closeAd();return;
      }catch(e){}
    }
    throw new Error('No writable storage folder');
  }catch(e){
    toast('Could not save: '+((e&&e.message)||e),4200);closeAd();
  }
}

   Ultra-Fast GPU Video Export Pipeline (CapCut Speed + 100% Clear Audio)

function seek0(){
  return new Promise(r=>{
    if(vid.currentTime<0.02){r();return}
    let done=false;
    const fin=()=>{if(done)return;done=true;vid.onseeked=null;r()};
    vid.onseeked=fin;vid.currentTime=0;setTimeout(fin,900);
  });
}

function snapFps(f){
  for(const v of[23.976,24,25,29.97,30,48,50,59.94,60])
    if(Math.abs(f-v)/v<0.015)return v;
  return clamp(Math.round(f)||30,15,60);
}

async function quickProbeFps(){
  if(!vid.requestVideoFrameCallback)return 30;
  const ts=[];
  await new Promise(res=>{
    let done=false;
    const fin=()=>{if(done)return;done=true;res()};
    const cb=(n,m)=>{
      ts.push(m.mediaTime);
      if(ts.length>=5)fin();
      else vid.requestVideoFrameCallback(cb);
    };
    vid.requestVideoFrameCallback(cb);
    vid.play().catch(fin);
    setTimeout(fin,450);
  });
  vid.pause();
  const d=[];
  for(let i=1;i<ts.length;i++){const dt=ts[i]-ts[i-1];if(dt>0.002&&dt<0.2)d.push(dt)}
  if(!d.length)return 30;
  d.sort((a,b)=>a-b);
  return snapFps(1/d[d.length>>1]);
}

async function decodeOriginalAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC||!st.file)return null;
    const ac=new AC({sampleRate:48000});
    try{
      const ab=await st.file.arrayBuffer();
      return await ac.decodeAudioData(ab);
    }catch(e){
      return null;
    }finally{try{ac.close()}catch(e){}}
  }catch(e){return null}
}

async function exportMP4Fast(){
  if(!(window.VideoEncoder&&window.AudioEncoder&&window.VideoFrame&&window.AudioData&&window.Mp4Muxer&&vid.requestVideoFrameCallback))return null;
  const dur=vid.duration;
  if(!isFinite(dur)||dur<=0)return null;
  const foot=$('adfoot');
  st.exporting=true;st.hold=false;st.lid++;
  vid.loop=false;vid.muted=true;vid.pause();

  try{
    foot.textContent='Preparing video…';
    const[w,h]=fit(vid.videoWidth,vid.videoHeight,1280);
    cv.width=w;cv.height=h;
    const[fps,buf]=await Promise.all([quickProbeFps(),decodeOriginalAudio()]);
    await seek0();

    const bitrate=Math.round(clamp(w*h*fps*0.18,3.2e6,12e6));
    const vcfg={width:w,height:h,bitrate,framerate:fps,latencyMode:'realtime',hardwareAcceleration:'prefer-hardware',avc:{format:'avc'}};
    let vc=null;
    for(const c of['avc1.64002A','avc1.4D402A','avc1.42E02A','avc1.4D401F','avc1.42E01F']){
      try{if((await VideoEncoder.isConfigSupported({...vcfg,codec:c})).supported){vc=c;break}}catch(e){}
    }
    if(!vc){
      delete vcfg.hardwareAcceleration;
      for(const c of['avc1.4D402A','avc1.42E01F']){
        try{if((await VideoEncoder.isConfigSupported({...vcfg,codec:c})).supported){vc=c;break}}catch(e){}
      }
    }
    if(!vc)return null;

    const sr=buf?buf.sampleRate:0;
    let useAudio=!!buf;
    const acfg={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,bitrate:192000};
    if(useAudio){
      try{if(!(await AudioEncoder.isConfigSupported(acfg)).supported)useAudio=false}catch(e){useAudio=false}
    }

    const target=new Mp4Muxer.ArrayBufferTarget();
    const mux=new Mp4Muxer.Muxer({
      target,
      video:{codec:'avc',width:w,height:h},
      ...(useAudio?{audio:{codec:'aac',numberOfChannels:2,sampleRate:sr}}:{}),
      fastStart:'in-memory'
    });

    let encErr=null;
    const venc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{encErr=e}});
    venc.configure({...vcfg,codec:vc});

    const aenc=useAudio?new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>{encErr=e}}):null;
    if(aenc)aenc.configure(acfg);

    /* Encode entire 100% original audio buffer cleanly at exact 1.0x timestamps */
    if(aenc&&buf){
      const totalSamples=Math.min(buf.length,Math.round(dur*sr));
      const c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):c0;
      const chunk=4096;
      for(let pos=0;pos<totalSamples;pos+=chunk){
        const n=Math.min(chunk,totalSamples-pos);
        const data=new Float32Array(n*2);
        data.set(c0.subarray(pos,pos+n),0);
        data.set(c1.subarray(pos,pos+n),n);
        aenc.encode(new AudioData({
          format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:2,
          timestamp:Math.round(pos*1e6/sr),data
        }));
      }
    }

    /* Hardware-accelerated WebGL GPU frame encoding at up to 2.0x playback speed, locked to exact 1.0x timestamps */
    const td=1/fps,totalFrames=Math.max(1,Math.round(dur*fps)),kf=Math.max(1,Math.round(fps*2));
    let nextN=0,lastM=-1,done=false;
    let fastRate=fps<=32?2.0:1.0;

    const emit=()=>{
      const f=new VideoFrame(cv,{timestamp:Math.round(nextN*1e6/fps),duration:Math.round(1e6/fps)});
      venc.encode(f,{keyFrame:nextN%kf===0});
      f.close();
      nextN++;
    };

    const onFrame=(now,meta)=>{
      if(done||encErr)return;
      vid.requestVideoFrameCallback(onFrame);
      const m=meta.mediaTime;
      if(lastM>=0&&m-lastM>td*1.65&&fastRate>1.0){
        fastRate=1.0;
        vid.playbackRate=1.0;
      }
      lastM=m;
      while(nextN<totalFrames&&nextN*td<m-td*0.5)emit();
      drawVideoFrame(w,h);
      while(nextN<totalFrames&&nextN*td<m+td*0.5)emit();
      foot.textContent='Rendering HD… '+Math.min(99,Math.round(100*m/dur))+'%';
      if(venc.encodeQueueSize>8&&vid.playbackRate>0.5)vid.playbackRate=0.5;
      else if(venc.encodeQueueSize<=2&&vid.playbackRate!==fastRate)vid.playbackRate=fastRate;
    };

    vid.playbackRate=fastRate;vid.defaultPlaybackRate=fastRate;
    const endP=new Promise(res=>{vid.onended=res});
    drawVideoFrame(w,h);
    vid.requestVideoFrameCallback(onFrame);
    await vid.play();
    await endP;
    done=true;vid.pause();vid.onended=null;

    if(encErr){try{venc.close();if(aenc)aenc.close()}catch(e){}return null}
    while(nextN<totalFrames)emit();
    await venc.flush();
    if(aenc)await aenc.flush();
    venc.close();if(aenc)aenc.close();
    if(encErr)return null;

    mux.finalize();
    return new Blob([target.buffer],{type:'video/mp4'});
  }finally{
    st.exporting=false;st.vtrack=null;vid.onended=null;
    vid.loop=true;vid.muted=false;vid.volume=1;
    vid.playbackRate=1;vid.defaultPlaybackRate=1;
    const[pw,ph]=fit(vid.videoWidth,vid.videoHeight,MAXV);
    st.dim={w:pw,h:ph};cv.width=pw;cv.height=ph;
    await seek0();vid.play().catch(()=>{});loop();
  }
}

function prepAudio(){

      st.adst=st.ac.createMediaStreamDestination();
      st.asrc.connect(st.adst);st.asrc.connect(st.mon);st.mon.connect(st.ac.destination);
    }

  }catch(e){}
}

async function exportVideoLegacy(stamp){
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mt=window.MediaRecorder&&types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!mt){toast('Video export is not supported on this device.',3800);closeAd();return}
  const ext=mt.startsWith('video/mp4')?'mp4':'webm',foot=$('adfoot');
  st.exporting=true;st.hold=false;st.lid++;
  vid.loop=false;vid.playbackRate=1;vid.defaultPlaybackRate=1;vid.muted=false;vid.volume=1;
  prepAudio();if(st.mon)st.mon.gain.value=0;

  try{
    await seek0();
    const[w,h]=fit(vid.videoWidth,vid.videoHeight,960);
    st.dim={w,h};cv.width=w;cv.height=h;
    let fs=cv.captureStream(0),vt=fs.getVideoTracks()[0];
    if(!vt||!vt.requestFrame){fs=cv.captureStream(30);vt=null}
    st.vtrack=vt;
    const tracks=[...fs.getVideoTracks()];
    let hasA=false;
    try{if(st.ac){await st.ac.resume();st.adst.stream.getAudioTracks().forEach(t=>{tracks.push(t);hasA=true})}}catch(e){}
    if(!hasA){try{const vs=vid.captureStream&&vid.captureStream();vs&&vs.getAudioTracks().forEach(t=>tracks.push(t))}catch(e){}}

    const rec=new MediaRecorder(new MediaStream(tracks),{
      mimeType:mt,videoBitsPerSecond:Math.round(clamp(w*h*30*0.18,2.5e6,10e6)),audioBitsPerSecond:192000
    }),ch=[];
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    const stopped=new Promise(r=>rec.onstop=r),ended=new Promise(r=>vid.onended=r);

    const drawLoop=()=>{
      if(!st.exporting)return;
      drawVideoFrame(w,h);
      foot.textContent='Rendering HD… '+Math.min(99,Math.round(100*vid.currentTime/(vid.duration||1)))+'%';
      if(vid.requestVideoFrameCallback)vid.requestVideoFrameCallback(drawLoop);
      else requestAnimationFrame(drawLoop);
    };
    rec.start(500);
    drawLoop();
    await vid.play();
    await ended;
    vid.pause();await wait(120);
    rec.stop();await stopped;
    const blob=new Blob(ch,{type:mt.split(';')[0]});
    $('adfoot').textContent='Saving…';
    await save('GBook-Camera-'+stamp+'.'+ext,blob);
  }finally{
    st.exporting=false;st.vtrack=null;vid.onended=null;vid.loop=true;
    if(st.mon)st.mon.gain.value=1;
    const[pw,ph]=fit(vid.videoWidth,vid.videoHeight,MAXV);
    st.dim={w:pw,h:ph};cv.width=pw;cv.height=ph;
    await seek0();vid.play().catch(()=>{});loop();
  }
}

async function exportVideo(stamp){
  let blob=null;
  try{blob=await exportMP4Fast()}catch(e){blob=null}
  if(blob){$('adfoot').textContent='Saving…';await save('GBook-Camera-'+stamp+'.mp4',blob);return}
  await exportVideoLegacy(stamp);
}

/* ============================================================================
   Clean Notification Permission Popup + Silent 08:00 AM Daily Reminder
   ============================================================================ */
const GATE_KEY='gbc_notifications_granted_v2';
function safelySaveNotificationChoice(){try{localStorage.setItem(GATE_KEY,'granted')}catch(e){}}
async function silentlySetupDailyReminder(){
  try{
    const C=window.Capacitor;
    const N=(C&&C.Plugins&&C.Plugins.LocalNotifications)||plug('LocalNotifications');
    if(N){
      try{
        if(typeof N.checkPermissions==='function'){
          let p=await N.checkPermissions();
          if(p&&p.display!=='granted'&&typeof N.requestPermissions==='function')await N.requestPermissions();
        }else if(typeof N.requestPermissions==='function'){
          await N.requestPermissions();
        }
      }catch(e){}
      try{
        if(typeof N.createChannel==='function')await N.createChannel({id:'daily',name:'G-Book Camera',description:'G-Book Camera notifications',importance:4,visibility:1});
      }catch(e){}
      try{
        if(typeof N.schedule==='function')await N.schedule({notifications:[{
          id:1808,
          title:'G-Book Camera',
          body:'Open G-Book Camera and enhance your photos & videos.',
          channelId:'daily',
          schedule:{on:{hour:8,minute:0},repeats:true,allowWhileIdle:true},
          extra:{gbcDailyReminder:true,version:5}
        }]});
      }catch(e){}
    }
  }catch(e){}
  try{
    const A=window.Android||window.GBookCameraBridge;
    if(A){
      try{if(typeof A.requestNotificationPermission==='function')await A.requestNotificationPermission()}catch(e){}
      try{if(typeof A.scheduleDailyNotification==='function')await A.scheduleDailyNotification(8,0,'G-Book Camera','Open G-Book Camera and enhance your photos & videos.')}catch(e){}
      try{if(typeof A.setNotificationPermissionGranted==='function')await A.setNotificationPermissionGranted(true)}catch(e){}
    }
  }catch(e){}
}
function grantNotificationAccess(){
  safelySaveNotificationChoice();
  const gate=$('notificationGate');
  if(gate){gate.style.display='none';gate.setAttribute('aria-hidden','true')}
  Promise.resolve().then(()=>silentlySetupDailyReminder()).catch(()=>{});
}
function checkNotificationGate(){
  let allowed=false;
  try{allowed=localStorage.getItem(GATE_KEY)==='granted'}catch(e){}
  const gate=$('notificationGate');
  if(gate){
    gate.style.display=allowed?'none':'flex';
    gate.setAttribute('aria-hidden',allowed?'true':'false');
  }
  if(allowed)Promise.resolve().then(()=>silentlySetupDailyReminder()).catch(()=>{});
}
$('allowNotifications').addEventListener('click',grantNotificationAccess);
checkNotificationGate();
