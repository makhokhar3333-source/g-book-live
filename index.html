   const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);
   enhance(x,w,h,st.amt/100,true);applyBokeh(x,w,h);
   const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
   $('adfoot').textContent='Saving…';await save('G-Book-Camera-HD.jpg',blob)
  }else{await exportVideo()}
 }catch(e){toast('Export failed: '+(e&&e.message||e),4000);closeAd()}}
function prepAudio(){
 try{
  if(!st.ac){const AC=window.AudioContext||window.webkitAudioContext;st.ac=new AC();
   st.asrc=st.ac.createMediaElementSource(vid);st.mon=st.ac.createGain();st.adst=st.ac.createMediaStreamDestination();
   st.asrc.connect(st.adst);st.asrc.connect(st.mon);st.mon.connect(st.ac.destination)}
  if(st.ac.state!=='running')st.ac.resume()

function pickSize(level,lim){lim=lim||22;
 const vw=vid.videoWidth,vh=vid.videoHeight,t=Math.max(st.amt/100,.6),S=[1920,1280,960,640];
 for(let i=level;i<4;i++){
  let[w,h]=fit(vw,vh,S[i]);w&=~1;h&=~1;cv.width=w;cv.height=h;hq();let tt=0;
  for(let k=0;k<3;k++){const t0=performance.now();cx.drawImage(vid,0,0,w,h);enhance(cx,w,h,t,true);tt+=performance.now()-t0}
  if(tt/3<=lim||i===3)return[w,h,i,tt/3]}}
async function recordOnce(mt,level){
 vid.pause();
 if(vid.currentTime>.05){await new Promise(r=>{vid.onseeked=r;vid.currentTime=0;setTimeout(r,700)});vid.onseeked=null}
 const[w,h,idx]=pickSize(level),foot=$('adfoot');st.nf=0;st.ema=0;
 let fs=cv.captureStream(0),vt=fs.getVideoTracks()[0];
 if(!vt||!vt.requestFrame){fs=cv.captureStream(30);vt=null}
 st.vtrack=vt;
 const tracks=[...fs.getVideoTracks()];let hasA=false;
 try{if(st.ac){await st.ac.resume();st.adst.stream.getAudioTracks().forEach(t=>{tracks.push(t);hasA=true})}}catch(e){}
 if(!hasA){try{const vs=vid.captureStream&&vid.captureStream();vs&&vs.getAudioTracks().forEach(t=>tracks.push(t))}catch(e){}}
 const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mt,videoBitsPerSecond:Math.round(clamp(w*h*30*.2,2.5e6,14e6)),audioBitsPerSecond:192000}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 let slow=false;
 const stopped=new Promise(r=>rec.onstop=r),ended=new Promise(res=>{vid.onended=res;st.onSlow=()=>{slow=true;res()}});
 vid.ontimeupdate=()=>{foot.textContent='Rendering HD… '+Math.round(100*vid.currentTime/(vid.duration||1))+'%'};
 st.watch=idx<3;rec.start(1000);await vid.play();await ended;vid.pause();
 st.watch=false;st.onSlow=null;if(!slow)await wait(200);
 rec.stop();await stopped;st.vtrack=null;vid.ontimeupdate=null;vid.onended=null;
 return slow?{slow:true,level:idx}:{blob:new Blob(ch,{type:mt.split(';')[0]})}}
const median=a=>{a=[...a].sort((x,y)=>x-y);return a[a.length>>1]};
function snapFps(f){for(const v of [23.976,24,25,29.97,30,48,50,59.94,60])if(Math.abs(f-v)/v<.012)return v;return Math.round(f)||30}
function seek0(){return new Promise(r=>{if(vid.currentTime<.01){r();return}vid.onseeked=()=>{vid.onseeked=null;r()};vid.currentTime=0;setTimeout(r,1500)})}
async function probeFps(){
 const ts=[];
 await new Promise(res=>{const cb=(n,m)=>{ts.push(m.mediaTime);if(ts.length>=14)res();else vid.requestVideoFrameCallback(cb)};
  vid.requestVideoFrameCallback(cb);vid.play().catch(()=>res());setTimeout(res,2500)});
 vid.pause();const d=[];for(let i=1;i<ts.length;i++){const x=ts[i]-ts[i-1];if(x>0)d.push(x)}

async function decodeAudio(){
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC({sampleRate:48000});
 try{return await ac.decodeAudioData(await st.file.arrayBuffer())}finally{try{ac.close()}catch(e){}}}

async function encodeAttempt(w,h,fps,rate,buf,dur){
 const foot=$('adfoot'),vcfg={width:w,height:h,bitrate:Math.round(clamp(w*h*fps*.25,4e6,16e6)),framerate:fps,latencyMode:'quality',avc:{format:'avc'}};
 let vc=null;
 for(const c of ['avc1.64002A','avc1.4D402A','avc1.42E02A','avc1.640028','avc1.4D4028','avc1.42E028']){
  try{if((await VideoEncoder.isConfigSupported({...vcfg,codec:c})).supported){vc=c;break}}catch(e){}}
 if(!vc)return null;
 const sr=buf?buf.sampleRate:0,acfg={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:2,bitrate:192000};
 if(buf){try{if(!(await AudioEncoder.isConfigSupported(acfg)).supported)return null}catch(e){return null}}
 const target=new Mp4Muxer.ArrayBufferTarget();
 const mux=new Mp4Muxer.Muxer({target,video:{codec:'avc',width:w,height:h},...(buf?{audio:{codec:'aac',numberOfChannels:2,sampleRate:sr}}:{}),fastStart:'in-memory'});
 let err=null;
 const venc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{err=e}});venc.configure({...vcfg,codec:vc});
 const aenc=buf?new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:e=>{err=e}}):null;if(aenc)aenc.configure(acfg);
 const total=buf?Math.round(dur*sr):0,blen=buf?buf.length:0,c0=buf&&buf.getChannelData(0),c1=buf&&(buf.numberOfChannels>1?buf.getChannelData(1):c0);let apos=0;
 const pump=sec=>{if(!aenc)return;const to=Math.min(total,Math.round(sec*sr));
  while(apos<to){const n=Math.min(4800,total-apos),data=new Float32Array(n*2),e=Math.min(blen,apos+n);
   if(e>apos){data.set(c0.subarray(apos,e),0);data.set(c1.subarray(apos,e),n)}
   aenc.encode(new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(apos*1e6/sr),data}));apos+=n}};
 const td=1/fps,totalFrames=Math.round(dur*fps),kf=Math.max(1,Math.round(fps*2));
 let nextN=0,lastM=-1,drops=0,done=false,aborted=false,slowed=false,resolveEnd;
 const emit=()=>{const f=new VideoFrame(cv,{timestamp:Math.round(nextN*1e6/fps),duration:Math.round(1e6/fps)});venc.encode(f,{keyFrame:nextN%kf===0});f.close();nextN++};
 const onFrame=(now,meta)=>{
  if(done||aborted||err)return;
  vid.requestVideoFrameCallback(onFrame);
  const m=meta.mediaTime;
  if(lastM>=0&&m-lastM>td*1.6)drops+=Math.round((m-lastM)/td)-1;
  lastM=m;
  while(nextN<totalFrames&&nextN*td<m-td*.5)emit();
  drawV();
  while(nextN<totalFrames&&nextN*td<m+td*.5)emit();
  pump(nextN*td+.3);
  foot.textContent='Rendering HD… '+Math.min(99,Math.round(100*m/dur))+'%';
  if(drops>Math.max(6,totalFrames*.04)&&rate>.12){aborted=true;resolveEnd();return}
  const q=venc.encodeQueueSize;
  if(q>6&&!slowed){slowed=true;vid.playbackRate=Math.max(.0625,rate*.4)}else if(q<=2&&slowed){slowed=false;vid.playbackRate=rate}};
 vid.playbackRate=rate;vid.defaultPlaybackRate=rate;
 const endP=new Promise(res=>{resolveEnd=res;vid.onended=res});
 drawV();
 vid.requestVideoFrameCallback(onFrame);
 await vid.play();await endP;done=true;vid.pause();vid.onended=null;
 if(aborted||err){try{venc.close();if(aenc)aenc.close()}catch(e){}return aborted?{retry:true}:null}
 await wait(80);
 while(nextN<totalFrames)emit();
 pump(dur+1);
 await venc.flush();if(aenc)await aenc.flush();
 venc.close();if(aenc)aenc.close();

async function exportMP4(){
 if(!(window.VideoEncoder&&window.AudioEncoder&&window.VideoFrame&&window.AudioData&&window.Mp4Muxer&&vid.requestVideoFrameCallback))return null;
 const dur=vid.duration;if(!isFinite(dur)||dur<=0)return null;
 const foot=$('adfoot');
 st.exporting=true;st.hold=false;st.lid++;vid.loop=false;vid.muted=true;vid.pause();
 try{
  foot.textContent='Preparing video…';
  await seek0();
  const pr=await probeFps(),fps=pr.fps;
  let buf=null;
  if(pr.hasAudio!==false){foot.textContent='Reading audio…';buf=await decodeAudio()}
  await seek0();
  let rate=1,res=null,lvl=0;
  for(let a=0;a<5&&!res;a++){
   const[w,h,idx,ms]=pickSize(lvl,56);
   rate=clamp(.4*(1000/fps)/ms*Math.pow(.75,a),.12,1);
   foot.textContent=a?'Optimizing for exact timing…':'Rendering HD…';
   const r=await encodeAttempt(w,h,fps,rate,buf,dur);
   if(!r)return null;
   if(r.retry){lvl=Math.min(3,idx+1);await seek0()}else res=r}
  return res?res.blob:null;
 }finally{
  st.exporting=false;st.watch=false;st.vtrack=null;vid.onended=null;vid.loop=true;vid.muted=false;vid.volume=1;vid.playbackRate=1;vid.defaultPlaybackRate=1;
  const[pw,ph]=fit(vid.videoWidth,vid.videoHeight,MAXV);cv.width=pw;cv.height=ph;
  try{vid.currentTime=0}catch(e){}vid.play().catch(()=>{});loop()}}

async function exportVideo(){
 let blob=null;

 if(blob){$('adfoot').textContent='Saving…';await save('G-Book-Camera-HD.mp4',blob);return}

async function exportVideoLegacy(){
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];

const GATE_KEY='gbc_notifications_granted_v2';

async function requestNativeNotificationPermission(){

  await N.schedule({notifications:[{id:1808,title:'G-Book Camera • iPhone 18 Pro Look',body:'Try G-Book Camera for iPhone Look! Capture & enhance crisp 1080p HD photos and videos with natural studio glow today.',channelId:'daily',schedule:{on:{hour:8,minute:0},repeats:true,allowWhileIdle:true},extra:{gbcDailyReminder:true,version:3}}]});

    method and a daily scheduler; unknown bridge APIs are never guessed. */

  const ok=await A.requestNotificationPermission();

 }

}
